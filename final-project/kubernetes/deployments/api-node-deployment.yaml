apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
  namespace: nerp-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      containers:
        - name: api-node
          image: nerp/api-node:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AI_SERVICE_URL
              value: http://ai-service-python:8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000

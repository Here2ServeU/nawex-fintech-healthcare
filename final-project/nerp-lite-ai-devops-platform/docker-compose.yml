services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nerp-postgres
    environment:
      POSTGRES_DB: nerp_dev
      POSTGRES_USER: nerp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerp_user -d nerp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-node:
    build:
      context: ./api-node
    container_name: nerp-api-node
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://nerp_user:${DB_PASSWORD}@postgres:5432/nerp_dev
      AI_SERVICE_URL: http://ai-service-python:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service-python:
    build:
      context: ./ai-service-python
    container_name: nerp-ai-service-python
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}

  frontend:
    build:
      context: ./frontend
    container_name: nerp-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000
    depends_on:
      - api-node

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nerp-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-node
      - ai-service-python

  grafana:
    image: grafana/grafana:11.1.4
    container_name: nerp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:

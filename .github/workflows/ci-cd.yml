name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./final-project/api-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check src/server.js

  validate-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./final-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  validate-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./final-project/ai-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py

  validate-terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./final-project/infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

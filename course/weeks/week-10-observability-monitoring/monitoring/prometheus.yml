global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-node
    static_configs:
      - targets: ["api-node:5000"]
    metrics_path: /metrics

  - job_name: ai-service-python
    static_configs:
      - targets: ["ai-service-python:8000"]
    metrics_path: /metrics
